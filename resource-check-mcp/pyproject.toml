[project]
name = "astromcp-host"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastmcp>=3,<4", "paramiko>=3,<6", "psutil>=6,<9", "pydantic>=2,<3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
astromcp-host = "resource_check_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
